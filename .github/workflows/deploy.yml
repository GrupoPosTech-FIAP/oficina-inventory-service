name: CD - Deploy na AWS (EKS)

on:
  workflow_dispatch:
    inputs:
      rds_endpoint:
        description: "Endpoint do RDS (rode: terraform output -raw DB_Endpoint em oficina-infra-database)"
        required: true
  push:
    tags:
      - "v*"

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: eks-oficina-terraform
  ECR_REPOSITORY: oficina-inventory-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE" || echo "⚠️ Imagem já existe no ECR. Pulando push e prosseguindo com o deploy..."

      - name: Configurar kubeconfig do EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Gerar Secret a partir dos GitHub Secrets
        run: |
          cat > k8s/overlays/aws/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: inventory-secret
          type: Opaque
          data:
            JWT_SECRET: $(printf '%s' "${{ secrets.JWT_SECRET }}" | base64 -w0)
            SPRING_DATASOURCE_PASSWORD: $(printf '%s' "${{ secrets.RDS_PASSWORD }}" | base64 -w0)
          EOF

      - name: Apontar a imagem publicada no overlay
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sed -i "s|newName:.*|newName: ${ECR_REGISTRY}/${ECR_REPOSITORY}|" k8s/overlays/aws/kustomization.yaml
          sed -i "s|newTag:.*|newTag: \"${{ steps.meta.outputs.tag }}\"|" k8s/overlays/aws/kustomization.yaml

      - name: Apontar o endpoint do RDS
        if: ${{ inputs.rds_endpoint != '' }}
        run: |
          sed -i "s|jdbc:postgresql://[^:]*:5432|jdbc:postgresql://${{ inputs.rds_endpoint }}:5432|" \
            k8s/overlays/aws/configmap-rds.yaml

      # Tópico e fila são criados pelo oficina-infra-cluster (messaging.tf). ARN e URL
      # contêm o account ID da sessão, então são resolvidos aqui pelo nome.
      - name: Apontar a mensageria (SNS/SQS)
        run: |
          TOPICO_ARN=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':oficina-inventory-events')].TopicArn | [0]" --output text)
          FILA_URL=$(aws sqs get-queue-url --queue-name oficina-inventory-queue --query QueueUrl --output text)
          if [ -z "$TOPICO_ARN" ] || [ "$TOPICO_ARN" = "None" ]; then
            echo "::error::Tópico oficina-inventory-events não encontrado. Rode o deploy do oficina-infra-cluster antes."
            exit 1
          fi
          sed -i "s|MENSAGERIA_TOPICO_ARN:.*|MENSAGERIA_TOPICO_ARN: ${TOPICO_ARN}|" k8s/overlays/aws/configmap-rds.yaml
          sed -i "s|MENSAGERIA_FILA_URL:.*|MENSAGERIA_FILA_URL: ${FILA_URL}|" k8s/overlays/aws/configmap-rds.yaml

      - name: Deploy no cluster (aplica os manifestos)
        run: kubectl apply -k k8s/overlays/aws

      - name: Aguardar o rollout
        run: kubectl rollout status deploy/oficina-inventory --timeout=300s

