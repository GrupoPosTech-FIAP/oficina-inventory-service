apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oficina-inventory
  name: oficina-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-inventory
  template:
    metadata:
      labels:
        app: oficina-inventory
    spec:
      initContainers:
        - name: init-db
          image: postgres:15-alpine
          envFrom:
            - configMapRef:
                name: inventory-config
            - secretRef:
                name: inventory-secret
          command:
            - sh
            - -c
            - |
              DB_HOST=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|^jdbc:postgresql://([^:/]+).*|\1|')
              DB_PORT=$(echo "$SPRING_DATASOURCE_URL" | sed -E 's|^jdbc:postgresql://[^:]+:([0-9]+).*|\1|')
              export PGPASSWORD="$SPRING_DATASOURCE_PASSWORD"
              echo "Verificando banco inventory_db em $DB_HOST:$DB_PORT..."
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$SPRING_DATASOURCE_USERNAME" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'inventory_db'" | grep -q 1 || \
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$SPRING_DATASOURCE_USERNAME" -d postgres -c "CREATE DATABASE inventory_db;"
      containers:
        - name: oficina-inventory
          image: oficina-inventory-image
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: inventory-config
            - secretRef:
                name: inventory-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 5
            failureThreshold: 30

