apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oficina-inventory
  name: oficina-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-inventory
  template:
    metadata:
      labels:
        app: oficina-inventory
    spec:
      containers:
        - name: oficina-inventory
          image: oficina-inventory-image
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: inventory-config
            - secretRef:
                name: inventory-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 5
            failureThreshold: 30

