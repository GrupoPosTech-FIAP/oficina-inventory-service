services:
  inventory-db:
    image: postgres:15-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-app:
    build: .
    container_name: inventory-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/${POSTGRES_DB:-inventory_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      inventory-db:
        condition: service_healthy

volumes:
  inventory_pgdata:

