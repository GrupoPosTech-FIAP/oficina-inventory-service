services:
  inventory-db:
    image: postgres:15-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-localstack:
    # Versão fixada: SNS/SQS locais para a mensageria da Saga (ADR 005 em oficina-app-api)
    image: localstack/localstack:4.4.0
    container_name: inventory-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack/init-mensageria.sh:/etc/localstack/init/ready.d/init-mensageria.sh
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mensageria-pronta"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-app:
    build: .
    container_name: inventory-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/${POSTGRES_DB:-inventory_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      SPRING_PROFILES_ACTIVE: default
      # Mensageria (LocalStack)
      MENSAGERIA_HABILITADA: "true"
      MENSAGERIA_ENDPOINT: http://inventory-localstack:4566
      MENSAGERIA_TOPICO_ARN: arn:aws:sns:us-east-1:000000000000:oficina-inventory-events
      MENSAGERIA_FILA_URL: http://inventory-localstack:4566/000000000000/oficina-inventory-queue
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Observabilidade: sem NEW_RELIC_LICENSE_KEY no .env o agente fica desligado
      OTEL_SERVICE_NAME: oficina-inventory-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.nr-data.net:4318
      OTEL_EXPORTER_OTLP_HEADERS: api-key=${NEW_RELIC_LICENSE_KEY:-}
    depends_on:
      inventory-db:
        condition: service_healthy
      inventory-localstack:
        condition: service_healthy

volumes:
  inventory_pgdata:

